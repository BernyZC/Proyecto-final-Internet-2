services:
  db:
    image: mysql:8.0
    container_name: mysql_tienda_gatos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tienda_gatos
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma_tienda_gatos
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db