{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-warning">
                <h4 class="mb-0">Registrar Accesorio para Gato</h4>
            </div>
            <div class="card-body bg-white">
                <form action="{{ url_for('registro') }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre del Producto</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Torre Rascador 3 Niveles" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="marca_id" class="form-label">Marca</label>
                            <select class="form-select" id="marca_id" name="marca_id" required>
                                <option value="" selected disabled>Selecciona marca...</option>
                                {% for marca in marcas %}
                                    <option value="{{ marca.id }}">{{ marca.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="categoria_id" class="form-label">Categoría</label>
                            <select class="form-select" id="categoria_id" name="categoria_id" required>
                                <option value="" selected disabled>Selecciona categoría...</option>
                                {% for cat in categorias %}
                                    <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="precio" class="form-label">Precio ($ MXN)</label>
                            <input type="number" step="0.01" class="form-control" id="precio" name="precio" placeholder="450.00" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="fecha_ingreso" class="form-label">Fecha de Ingreso</label>
                            <input type="date" class="form-control" id="fecha_ingreso" name="fecha_ingreso" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="imagen" class="form-label">Foto del Accesorio</label>
                        <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Guardar en Inventario</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
